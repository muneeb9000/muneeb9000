<svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="border-grad-s1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#570100"/>
      <stop offset="50%" stop-color="#8a0200"/>
      <stop offset="100%" stop-color="#570100">
        <animate attributeName="offset" values="0.6;1.4;0.6" dur="4.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="border-grad-s2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#570100"/>
      <stop offset="50%" stop-color="#8a0200"/>
      <stop offset="100%" stop-color="#570100">
        <animate attributeName="offset" values="0.6;1.4;0.6" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Card 1: Digital Education Infra -->
  <g>
    <rect x="10" y="10" width="440" height="240" rx="14" fill="url(#bg-grad-s)" stroke="url(#border-grad-s1)" stroke-width="2"/>
    <text x="34" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#f8f8f8">📖</text>
    <text x="64" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f8f8f8">Digital Education Infrastructure</text>

    <text x="34" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">Building scalable backend systems that make quality</text>
    <text x="34" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">education content reachable — mock tests, past papers,</text>
    <text x="34" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">and sharing tools designed around how students in</text>
    <text x="34" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">Pakistan actually study.</text>

    <g>
      <rect x="34" y="160" width="66" height="27" rx="6" fill="#570100"/>
      <text x="67" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Laravel</text>
      <rect x="108" y="160" width="62" height="27" rx="6" fill="#570100"/>
      <text x="139" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">MySQL</text>
      <rect x="178" y="160" width="106" height="27" rx="6" fill="#570100"/>
      <text x="231" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">System Design</text>
      <rect x="292" y="160" width="112" height="27" rx="6" fill="#570100"/>
      <text x="348" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Scalable APIs</text>
    </g>
  </g>

  <!-- Card 2: Agentic AI x Workflows -->
  <g>
    <rect x="470" y="10" width="440" height="240" rx="14" fill="url(#bg-grad-s)" stroke="url(#border-grad-s2)" stroke-width="2"/>
    <text x="494" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#f8f8f8">🤖</text>
    <text x="524" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f8f8f8">Agentic AI × Business Workflows</text>

    <text x="494" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">Automating business processes by wiring AI agents into</text>
    <text x="494" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">real operational workflows — not chatbots bolted on, but</text>
    <text x="494" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">AI actually doing the work inside a live business system.</text>

    <g>
      <rect x="494" y="150" width="88" height="27" rx="6" fill="#570100"/>
      <text x="538" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">AI Agents</text>
      <rect x="588" y="150" width="150" height="27" rx="6" fill="#570100"/>
      <text x="663" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Workflow Automation</text>
      <rect x="744" y="150" width="120" height="27" rx="6" fill="#570100"/>
      <text x="804" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">API Integration</text>
    </g>
  </g>
</svg>
