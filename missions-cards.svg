<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="border-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#570100"/>
      <stop offset="50%" stop-color="#8a0200"/>
      <stop offset="100%" stop-color="#570100">
        <animate attributeName="offset" values="0.6;1.4;0.6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="border-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#570100"/>
      <stop offset="50%" stop-color="#8a0200"/>
      <stop offset="100%" stop-color="#570100">
        <animate attributeName="offset" values="0.6;1.4;0.6" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Card 1: Pinexa -->
  <g>
    <rect x="10" y="10" width="440" height="280" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad-1)" stroke-width="2"/>
    <text x="34" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f8f8f8">📚</text>
    <text x="66" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#f8f8f8">Pinexa</text>

    <text x="34" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8e8e8">
      Changing how Pakistani students &amp; teachers
    </text>
    <text x="34" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8e8e8">
      learn and share.
    </text>

    <text x="34" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">MCQ-based mock tests, past papers, chapter tests, and</text>
    <text x="34" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">notes for Punjab board students (9th–12th) — built for</text>
    <text x="34" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">faster, more accessible exam prep and sharing.</text>

    <g>
      <rect x="34" y="186" width="64" height="28" rx="6" fill="#570100"/>
      <text x="66" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Flutter</text>
      <rect x="106" y="186" width="66" height="28" rx="6" fill="#570100"/>
      <text x="139" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Laravel</text>
      <rect x="180" y="186" width="62" height="28" rx="6" fill="#570100"/>
      <text x="211" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">MySQL</text>
    </g>

    <circle cx="42" cy="248" r="5" fill="#8a0200">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#e8e8e8">Launching soon</text>
  </g>

  <!-- Card 2: TableFlow -->
  <g>
    <rect x="470" y="10" width="440" height="280" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad-2)" stroke-width="2"/>
    <text x="494" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#f8f8f8">🍽️</text>
    <text x="526" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#f8f8f8">TableFlow</text>

    <text x="494" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8e8e8">
      Digitalizing the restaurant waiting queue.
    </text>

    <text x="494" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">Replaces physical waiting lines with a live digital queue</text>
    <text x="494" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">— customers scan a QR code and track their order status</text>
    <text x="494" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#a8a8a8">in real time, no more standing around guessing.</text>

    <g>
      <rect x="494" y="168" width="68" height="28" rx="6" fill="#570100"/>
      <text x="528" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Laravel</text>
      <rect x="570" y="168" width="64" height="28" rx="6" fill="#570100"/>
      <text x="602" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">MySQL</text>
      <rect x="642" y="168" width="70" height="28" rx="6" fill="#570100"/>
      <text x="677" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Livewire</text>
    </g>

    <circle cx="502" cy="230" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="516" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#e8e8e8">Shipped &amp; validated</text>
  </g>
</svg>
